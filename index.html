<style>
:root {
  --bg: #f7f5f0;
  --white: #fff;
  --cream: #eeeae1;
  --dark: #25231f;
  --muted: #777168;
  --accent: #a98b6b;
  --accent-light: #d6c1a7;
  --line: #e5dfd4;
  --serif: 'Playfair Display', serif;
  --sans: 'DM Sans', sans-serif;
  --container: 1180px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  background: var(--bg);
  color: var(--dark);
  font-family: var(--sans);
  line-height: 1.7;
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

button {
  font: inherit;
}

img, video {
  display: block;
  max-width: 100%;
}

.container {
  width: min(var(--container), 88%);
  margin: auto;
}

section {
  padding: 105px 0;
}

.eyebrow {
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 20px;
}

h1, h2, h3 {
  font-family: var(--serif);
  font-weight: 400;
  line-height: 1.2;
}

.section-title {
  font-size: clamp(36px, 5vw, 58px);
  margin-bottom: 22px;
  letter-spacing: -1px;
}

.section-description {
  max-width: 680px;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 48px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 15px 29px;
  background: var(--dark);
  color: white;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border: 1px solid var(--dark);
  transition: .35s ease;
  cursor: pointer;
}

.btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: translateY(-3px);
}

.btn-outline {
  background: transparent;
  color: var(--dark);
  margin-left: 10px;
}

.btn-outline:hover {
  color: white;
}

.text-link {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 6px;
  transition: .3s;
}

.text-link:hover {
  color: var(--accent);
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(247,245,240,.96);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--line);
}

nav {
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: var(--serif);
  font-size: 25px;
  letter-spacing: 1px;
}

.logo span {
  color: var(--accent);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 26px;
  list-style: none;
}

.nav-links a {
  font-size: 11px;
  color: #514d46;
  transition: .3s;
}

.nav-links a:hover {
  color: var(--accent);
}

.menu-toggle {
  display: none;
  background: none;
  border: 0;
  font-size: 26px;
  cursor: pointer;
}

/* HERO */

.hero {
  min-height: 730px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  width: 620px;
  height: 620px;
  border: 1px solid #e6ddcf;
  border-radius: 50%;
  right: -200px;
  top: 40px;
}

.hero::after {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  border: 1px solid #e6ddcf;
  border-radius: 50%;
  right: -90px;
  top: 150px;
}

.hero-content {
  max-width: 850px;
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: clamp(55px, 8vw, 100px);
  line-height: 1.04;
  margin-bottom: 30px;
  letter-spacing: -2px;
}

.hero h1 span {
  color: var(--accent);
  font-style: italic;
}

.hero-text {
  max-width: 620px;
  color: var(--muted);
  font-size: 15px;
  margin-bottom: 35px;
}

.hero-note {
  margin-top: 48px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* TRUST STRIP */

.trust-strip {
  background: var(--dark);
  color: white;
  padding: 28px 0;
}

.strip-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  text-align: center;
}

.strip-item {
  color: #e3dbd0;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ABOUT */

.about {
  background: var(--cream);
}

.about-grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 85px;
  align-items: center;
}

.about-copy p {
  color: #69645c;
  font-size: 14px;
  margin-bottom: 19px;
}

.about-visual {
  min-height: 430px;
  background:
    linear-gradient(145deg, rgba(37,35,31,.12), rgba(37,35,31,.55)),
    url("https://images.unsplash.com/photo-1523726491678-bf852e717f6a?w=1200") center/cover;
  display: flex;
  align-items: flex-end;
  padding: 35px;
}

.about-visual-text {
  color: white;
  font-family: var(--serif);
  font-size: 30px;
  max-width: 330px;
}

.about-visual-text span {
  color: #e5c9a9;
  font-style: italic;
}

/* PHILOSOPHY */

.philosophy {
  text-align: center;
  background: var(--dark);
  color: white;
}

.philosophy blockquote {
  font-family: var(--serif);
  font-size: clamp(30px, 5vw, 57px);
  line-height: 1.4;
  max-width: 920px;
  margin: auto;
}

.philosophy blockquote span {
  color: var(--accent-light);
  font-style: italic;
}

.philosophy p {
  color: #c5bdb1;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 30px;
  text-transform: uppercase;
}

/* EXPERTISE */

.expertise-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.expertise-card {
  background: white;
  border: 1px solid var(--line);
  padding: 34px 28px;
  transition: .35s;
}

.expertise-card:hover {
  transform: translateY(-7px);
  border-color: var(--accent);
  box-shadow: 0 15px 35px rgba(37,35,31,.06);
}

.card-number {
  color: var(--accent);
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 23px;
}

.expertise-card h3 {
  font-size: 24px;
  margin-bottom: 15px;
}

.expertise-card p {
  font-size: 12px;
  color: var(--muted);
}

/* SKILLS */

.skills {
  background: var(--cream);
}

.skill-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 65px;
}

.skill-group h3 {
  font-size: 27px;
  margin-bottom: 25px;
}

.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.skill-tags span {
  background: white;
  border: 1px solid #e0d8cc;
  padding: 12px 18px;
  font-size: 11px;
  color: #625a50;
  transition: .3s;
}

.skill-tags span:hover {
  background: var(--dark);
  color: white;
}

.skill-note {
  margin-top: 30px;
  color: var(--muted);
  font-size: 12px;
  max-width: 550px;
}

/* VIDEO SHOWCASE */

.video-section {
  background: var(--bg);
}

.video-wrapper {
  position: relative;
  background: #201f1b;
  overflow: hidden;
  border: 1px solid var(--line);
}

.video-wrapper video {
  width: 100%;
  aspect-ratio: 16 / 8;
  object-fit: cover;
  background: #25231f;
}

.video-caption {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 23px 27px;
  background: white;
}

.video-caption h3 {
  font-size: 23px;
}

.video-caption p {
  color: var(--muted);
  font-size: 11px;
}

/* FEATURED PROJECT */

.projects {
  background: var(--cream);
}

.project-feature {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  background: white;
  border: 1px solid var(--line);
  overflow: hidden;
}

.project-image {
  min-height: 480px;
  overflow: hidden;
}

.project-image img {
  width: 100%;
  height: 100%;
  min-height: 480px;
  object-fit: cover;
  transition: .6s;
}

.project-feature:hover .project-image img {
  transform: scale(1.04);
}

.project-content {
  padding: 55px 42px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.project-label {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.project-content h3 {
  font-size: 37px;
  margin-bottom: 20px;
}

.project-content p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}

.project-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 28px;
}

.project-tags span {
  background: var(--bg);
  padding: 7px 11px;
  font-size: 9px;
  color: #6b6257;
  letter-spacing: .5px;
}

.project-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  align-items: center;
}

/* CASE STUDY */

.case-study {
  background: var(--bg);
}

.case-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.case-card {
  background: white;
  padding: 35px;
  border: 1px solid var(--line);
  transition: .3s;
}

.case-card:hover {
  transform: translateY(-5px);
}

.case-card h3 {
  font-size: 25px;
  margin-bottom: 15px;
}

.case-card p {
  font-size: 12px;
  color: var(--muted);
}

/* PROCESS */

.process {
  background: var(--dark);
  color: white;
}

.process .section-description {
  color: #c7c0b5;
}

.process-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}

.process-card {
  border-top: 1px solid var(--accent);
  padding-top: 25px;
}

.process-number {
  color: var(--accent-light);
  font-family: var(--serif);
  font-size: 38px;
  margin-bottom: 20px;
}

.process-card h3 {
  font-size: 23px;
  margin-bottom: 13px;
}

.process-card p {
  color: #c7c0b5;
  font-size: 12px;
}

/* SERVICES */

.services {
  background: var(--cream);
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.service-card {
  background: white;
  padding: 34px 28px;
  border-bottom: 2px solid transparent;
  transition: .3s;
}

.service-card:hover {
  border-color: var(--accent);
  transform: translateY(-5px);
}

.service-card h3 {
  font-size: 24px;
  margin-bottom: 14px;
}

.service-card p {
  color: var(--muted);
  font-size: 12px;
}

/* QUALITY */

.quality-grid {
  display: grid;
  grid-template-columns: .9fr 1.1fr;
  gap: 80px;
  align-items: start;
}

.quality-list {
  list-style: none;
}

.quality-list li {
  border-bottom: 1px solid var(--line);
  padding: 17px 0;
  font-size: 13px;
  color: #625d55;
}

.quality-list li::before {
  content: "✦";
  color: var(--accent);
  margin-right: 14px;
}
